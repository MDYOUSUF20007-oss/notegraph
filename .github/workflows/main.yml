name: Build & Release NoteGraph (Android, Windows, macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK to notegraph.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/notegraph.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-APK
          path: app/build/outputs/apk/debug/notegraph.apk

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package Windows Installer & Portable (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-Windows
          path: desktop/dist/*.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package macOS Apple Silicon & Intel (.dmg / .zip)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          sudo mdutil -a -i off || true
          for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
          for arch in arm64 x64; do
            for attempt in 1 2 3; do
              npm run "pack:mac:$arch" && break
              if [ "$attempt" -eq 3 ]; then
                echo "macOS $arch packaging failed after 3 attempts"
                exit 1
              fi
              echo "Retrying macOS $arch packaging (attempt $((attempt + 1))/3)..."
              for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
              sleep 6
            done
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  release:
    needs: [ build-android, build-windows, build-macos ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Publish Multi-Platform Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NoteGraph v2.0 — Minimalist UI & Gradients (Android, Windows & macOS)"
          make_latest: true
          prerelease: false
          body: |
            Automated cross-platform builds from the latest `main` commit.

            ### What's New
            - **Minimalist UI Overhaul (Android, Windows & macOS):** Borderless writing mode, frosted translucent glass toolbars, hairline card framing, and clean vector icons replacing toolbar clutter.
            - **Choosable Gradients Per Theme:** Independently customize color gradients for **AMOLED** (*Obsidian Violet, Aurora Cyan, Crimson Velvet, Emerald Flux, Solar Ember, OLED Stealth*), **Kindle Paper** (*Warm Sepia, Sage Folio, Dusty Rose, Oxford Ink, Classic Ink*), **Matte / Mac** (*Studio Cyan, Nord Indigo, Titanium Sage, Warm Copper, Anodized Gray*), and **Blackboard** (*Emerald Chalk, Matcha Slate, Lecture Cobalt*) — or toggle **Ambient Gradients** off anytime for classic flat surfaces.
            - **Live Appearance Studio:** Switch themes and gradient orbs directly from the Android Home header/Settings or the top bar Gradient Studio in the Windows/Mac app.
            - **Rollback Safety:** Previous UI baseline preserved at git tag `pre-ui-remake` (`82e6f03`, code `NG-REVERT-82E6F03`).

            ### Downloads
            - **Android (`notegraph.apk`):** Minimalist Home & Editor, Samsung Notes-style PDF import & direct on-page markup (Zoom/Pan, Highlighter, Shape Snap, S-Pen Palm Rejection, Night PDF, Margin Notes, "Open with -> NoteGraph"), reMarkable-style Corner-Fold page turn physics (`Corner Fold`, `3D Curl`, `Slide Stack`), live `[[Wiki-Link]]` autocomplete, ink templates & Fullscreen Sketch Studio, Vault PIN lock, Trash & templates, AMOLED/Kindle/Matte themes with choosable gradients, and drag-and-drop folders with checklists.
            - **Windows x64 (`NoteGraph-Board-2.0.0-Windows-x64-Setup.exe` & `NoteGraph-Board-2.0.0-Windows-x64-Portable.exe`):** Low-latency infinite classroom board (`F11` Zen mode, Rainbow Vanishing Laser, Dots/Cornell/XY/Blackboard grids, PDF slide markup, `Ctrl+V` screenshot paste, interactive checklist cards, Follow-Up reminders, `Ctrl+K` Command Palette, 2D Knowledge Graph, Gradient Studio, & Android `.zip` vault sync).
            - **macOS Apple Silicon (`arm64`) & Intel (`x64`) (`NoteGraph-Board-2.0.0-macOS-arm64.dmg`, `NoteGraph-Board-2.0.0-macOS-x64.dmg`, & `.zip`):** Native Electron builds of NoteGraph Board with Matte / Mac Studio gradients and atmospheric canvas themes. *(Unsigned CI build: on first launch, right-click → Open if Gatekeeper warns you.)*
          files: release-assets/*
