name: Build & Release NoteGraph (Android, Windows, macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Android Unit Tests & Build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK to notegraph.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/notegraph.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-APK
          path: app/build/outputs/apk/debug/notegraph.apk

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package Windows Installer & Portable (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-Windows
          path: desktop/dist/*.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package macOS Apple Silicon & Intel (.dmg / .zip)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          sudo mdutil -a -i off || true
          for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
          for arch in arm64 x64; do
            for attempt in 1 2 3; do
              npm run "pack:mac:$arch" && break
              if [ "$attempt" -eq 3 ]; then
                echo "macOS $arch packaging failed after 3 attempts"
                exit 1
              fi
              echo "Retrying macOS $arch packaging (attempt $((attempt + 1))/3)..."
              for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
              sleep 6
            done
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  release:
    needs: [ build-android, build-windows, build-macos ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Publish Multi-Platform Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NoteGraph v2.0 — PDF OCR, Swipe-Toss Pages, Voice Visualizer & PPTX Fix"
          make_latest: true
          prerelease: false
          body: |
            Automated cross-platform builds from the latest `main` commit.

            ### What's New
            - **Frosted Two-Tier Obsidian Card System (Android):** Upgraded note list cards, Search & Tag cards, Canvas Graph Node Inspector, Appearance/Vault panels, and Note Graph Metadata views with `ObsidianCard` — deep `#1A1A1E -> #0C0C0E` surfaces, dynamic active accent borders & specular edge highlights (`#8B5CF6` purple / Obsidian Gold / active palette), illuminated icon badges & stat tiles, and untruncated Tier 2 sync/timestamp/storage footers.
            - **Offline PDF OCR Window (Android):** Extract text from imported PDFs in a dedicated window — scan the current page, a custom page range, or all pages (`Extract All`), pick individual text blocks or edit/trim before copying or inserting straight into your note.
            - **Reader Upward Throw-Away Page Gesture:** Turn horizontally/diagonally from any corner like a book (`Corner Fold`, `3D Curl`, `Slide Stack`) OR swipe up to physically toss the page away and advance to the next note.
            - **Theme-Matched Voice Visualizer:** Live microphone level bars and interactive waveform playback scrubbing synced dynamically to your active **AMOLED**, **Kindle Paper**, or **Matte / Mac** gradient palette.
            - **Remade PPTX Slide Deck Export:** Rebuilt OpenXML `.pptx` engine with full slide masters, blank layouts, widescreen `16:9` paginated cards, and embedded vector ink, image, & PDF visuals compatible with both Microsoft PowerPoint and Apple Keynote.
            - **Minimalist UI & Gradients:** Choosable accents for AMOLED, Kindle Paper, Matte / Mac, and Blackboard with rollback tag `pre-ui-remake` (`82e6f03`, code `NG-REVERT-82E6F03`).

            ### Downloads
            - **Android (`notegraph.apk`):** Offline PDF OCR Extractor window, Samsung Notes-style PDF markup (Zoom/Pan, Highlighter, Shape Snap, S-Pen Palm Rejection, Night PDF, Margin Notes), Book Reader (`Corner Fold` / `3D Curl` / `Slide Stack` + upward swipe-up page toss), Theme-Matched Voice Visualizer, rebuilt PowerPoint & Keynote `.pptx` export, live `[[Wiki-Link]]` autocomplete, Fullscreen Sketch Studio, Vault PIN lock, Trash, AMOLED/Kindle/Matte gradients, and drag-and-drop folders with checklists.
            - **Windows x64 (`NoteGraph-Board-2.0.0-Windows-x64-Setup.exe` & `NoteGraph-Board-2.0.0-Windows-x64-Portable.exe`):** Low-latency infinite classroom board (`F11` Zen mode, Rainbow Vanishing Laser, Dots/Cornell/XY/Blackboard grids, PDF slide markup, `Ctrl+V` screenshot paste, interactive checklist cards, Follow-Up reminders, `Ctrl+K` Command Palette, 2D Knowledge Graph, Gradient Studio, & Android `.zip` vault sync).
            - **macOS Apple Silicon (`arm64`) & Intel (`x64`) (`NoteGraph-Board-2.0.0-macOS-arm64.dmg`, `NoteGraph-Board-2.0.0-macOS-x64.dmg`, & `.zip`):** Native Electron builds of NoteGraph Board with Matte / Mac Studio gradients and atmospheric canvas themes. *(Unsigned CI build: on first launch, right-click → Open if Gatekeeper warns you.)*
          files: release-assets/*
