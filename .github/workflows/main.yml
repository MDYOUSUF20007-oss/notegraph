name: Build & Release NoteGraph (Android, Windows, macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Android Unit Tests & Build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK to notegraph.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/notegraph.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-APK
          path: app/build/outputs/apk/debug/notegraph.apk

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package Windows Installer & Portable (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-Windows
          path: desktop/dist/*.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies & Prepare Vendor Assets
        working-directory: desktop
        run: npm ci

      - name: Run Desktop Unit Tests
        working-directory: desktop
        run: npm test

      - name: Package macOS Apple Silicon & Intel (.dmg / .zip)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          sudo mdutil -a -i off || true
          for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
          for arch in arm64 x64; do
            for attempt in 1 2 3; do
              npm run "pack:mac:$arch" && break
              if [ "$attempt" -eq 3 ]; then
                echo "macOS $arch packaging failed after 3 attempts"
                exit 1
              fi
              echo "Retrying macOS $arch packaging (attempt $((attempt + 1))/3)..."
              for v in /Volumes/NoteGraph*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
              sleep 6
            done
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteGraph-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  release:
    needs: [ build-android, build-windows, build-macos ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Publish Multi-Platform Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NoteGraph v2.0 — Bespoke Luxury UI, Runtime Engine Switcher & Cross-OS Sync"
          make_latest: true
          prerelease: false
          body: |
            Automated cross-platform builds from the latest `main` commit.

            ### What's New
            - **Bespoke Luxury UI & Strict Curated Theme Architecture (Android):** Replaced glowing neon patterns, chunky cards, drop shadows, and ambient gradients with a strict flat architecture across **AMOLED Black** (`#000000` / `#121212`, `1px` `#262626` borders, `#8B5CF6` accent), **Kindle Parchment** (`#F4F1EA`), and **Matte Minimalist** (`#1E2229`).
            - **Technical Blueprint Knowledge Graph (Android):** Clean minimalist circle & rounded-rectangle cluster hub nodes with `#8B5CF6` restraint, `1px` `30%`-opacity smooth curved Bezier edges over a drafting grid, monospace labels & `[x,y]` coordinates, and anti-overlap spacing.
            - **Edge-to-Edge Canvas, Restrained Toolbars & Spine-Hinged Physics (Android):** Full-bleed ink & PDF drawing surfaces, razor-thin `1.dp` hairline floating pills with `0.dp` shadow, Serif prose paired with Monospace chrome, and physically anchored 3D spine-hinge page curls.
            - **Runtime Interface Engine Switcher (Android):** Switch live between **Bespoke Luxury (Default)** and **Classic UI** (`ObsidianCard`) at the bottom of Appearance & Vault Settings with zero app restart.
            - **Cross-OS Node Sync, Lasso Fix, Laser Optimizer & Field Guide (Android, Windows, macOS):** Symmetric two-way LWW sync across Shared Cloud Folders, Direct Wi-Fi LAN peer-to-peer sync, and Sync Package `.zip` v2; directional Lasso drag fix; O(1) bounded Rainbow Vanishing Laser; and built-in interactive Field Guide tutorial with 1-tap demo graph.
            - **Previously in v2.0:** Offline ML Kit PDF OCR window, upward swipe-toss Reader gesture, theme-matched voice visualizer, and PowerPoint/Keynote-compatible `.pptx` export.

            ### Downloads
            - **Android (`notegraph.apk`):** Bespoke Luxury UI + Classic UI runtime switcher, Blueprint Knowledge Graph, Edge-to-Edge Sketch & PDF Markup + Offline OCR, Cross-OS LAN/Folder/ZIP Node Sync, Book Reader (`Corner Fold` / `3D Curl` / `Slide Stack` + swipe-up page toss), Interactive Tutorial, Vault PIN lock, Trash, and `.pptx`/`.pdf`/`.docx`/`.png`/`.md`/`.zip` export.
            - **Windows x64 (`NoteGraph-Board-2.0.0-Windows-x64-Setup.exe` & `NoteGraph-Board-2.0.0-Windows-x64-Portable.exe`):** Low-latency infinite classroom board (`F11` Zen mode, O(1) Rainbow Vanishing Laser, directional Lasso move, Dots/Cornell/XY/Blackboard grids, PDF slide markup, `Ctrl+V` screenshot paste, interactive checklists, `Ctrl+K` Command Palette, 2D Graph, & Cross-OS LAN/Folder/ZIP sync).
            - **macOS Apple Silicon (`arm64`) & Intel (`x64`) (`NoteGraph-Board-2.0.0-macOS-arm64.dmg`, `NoteGraph-Board-2.0.0-macOS-x64.dmg`, & `.zip`):** Native Electron builds of NoteGraph Board with full Cross-OS sync and board tools. *(Unsigned CI build: on first launch, right-click → Open if Gatekeeper warns you.)*
          files: release-assets/*
