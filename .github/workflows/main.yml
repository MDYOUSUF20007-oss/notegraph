name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Rename APK to notegraph.apk
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/notegraph.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteGraph-APK
        path: app/build/outputs/apk/debug/notegraph.apk

    - name: Publish to GitHub Releases
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "NoteGraph Latest"
        body: "Automated build of notegraph.apk from the latest commit."
        files: app/build/outputs/apk/debug/notegraph.apk
        prerelease: false
